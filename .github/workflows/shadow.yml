name: shadow-canary

# Runs the full mock pipeline end-to-end on a schedule to catch dependency /
# environment drift between real eval runs. Keyless (stub judge), so no secrets.
on:
  schedule:
    # ~biweekly: 1st and 15th of each month at 06:00 UTC.
    - cron: "0 6 1,15 * *"
  workflow_dispatch: {}

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: uv pip install --system -e ".[dev]"

      - name: Run shadow canary
        run: vgeval canary

      - name: Upload canary run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-run
          path: runs/canary
          retention-days: 14
