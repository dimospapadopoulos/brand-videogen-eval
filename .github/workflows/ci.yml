name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit + e2e tests
        run: pytest -q

      - name: Shadow canary (full mock pipeline, keyless)
        run: vgeval canary
