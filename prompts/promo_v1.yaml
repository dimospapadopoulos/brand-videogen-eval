# Real promo suite — Nike + Lipton campaigns, basic product motion.
# Drop the two source images into assets/samples/images/ with the names below,
# then: vgeval run --suite promo_v1
version: promo_v1
prompts:
  - id: nike_basketball
    category: apparel
    source_image: assets/samples/images/nike_basketball.jpg
    locale: en-US
    # Nike apparel shot: near-monochrome black/greys, no on-product copy.
    brand_palette: ["#000000", "#111111", "#3A3A3A", "#FFFFFF"]
    prompt: >-
      Cinematic slow-motion sports film from this still. Subtle, controlled
      motion only: the athlete holds the pose with micro-movements — a slow
      breath, faint muscle tension, the basketball rotating a few degrees
      in-hand. Camera does one slow, smooth dolly push-in (total move under 8%
      of frame width), zero rotation or tilt, keeping the athlete the clear
      hero. Preserve exact anatomy, apparel fit, and the logo/swoosh as rigid,
      crisp, undistorted surfaces — no warping, morphing, extra limbs, or
      hallucinated text. Keep the original dramatic side lighting, shadows,
      court reflections, color grade, and contrast throughout. Atmosphere only:
      faint dust motes and soft light haze in the backlight. No new objects, no
      crowd, no camera shake. Photoreal, high-end brand-commercial look.

  - id: lipton_icetea
    category: beverage
    source_image: assets/samples/images/lipton_icetea.webp
    locale: en
    expected_copy: "Lipton FRUITY ICE TEA"
    # Lipton cans: yellow / red / green brand colors on a dark set.
    brand_palette: ["#F6C000", "#E4002B", "#00A651", "#005EB8", "#111111"]
    prompt: >-
      Cinematic premium beverage commercial from this still. Restrained motion
      only: fine condensation glistens and a few droplets bead slowly down the
      cans, subtle sparkle on the ice, a faint cool vapor drifting. Camera does
      one slow, perfectly linear lateral track (total travel 5-8% of frame
      width), zero rotation or tilt, creating gentle 3D parallax that
      accentuates the cans' depth. Keep every can's geometry, the logo,
      typography, and label text 100% rigid, crisp, and legible — treat all
      branding as a fixed high-resolution vector surface: no warping, texture
      swimming, misspelling, or invented copy. Preserve the exact studio
      lighting, specular highlights, reflections, colors, and dark background
      from the source image throughout. No hands, no new objects, no camera
      shake. Photoreal, high-end, appetizing premium look.
