[project]
name = "vgeval"
version = "0.1.0"
description = "Image-to-video model evaluation harness for promo/advertising generation at scale"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Dimos Papadopoulos" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "imageio[ffmpeg]>=2.34",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
    "anthropic>=0.40",
    "streamlit>=1.37",
    "pandas>=2.2",
    "altair>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
vgeval = "vgeval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vgeval"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# Typer relies on function calls (Option/Argument) in parameter defaults.
"src/vgeval/cli.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
